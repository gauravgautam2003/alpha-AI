services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    env_file:
      - ./services/auth/.env
    environment:
      PORT: 8001
      REDIS_URL: redis://redis:6379
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy

  chat:
    build:
      context: .
      dockerfile: services/chat/Dockerfile
    env_file:
      - ./services/chat/.env
    environment:
      PORT: 8002
      REDIS_URL: redis://redis:6379
    ports:
      - "8002:8002"
    depends_on:
      redis:
        condition: service_healthy

  agent:
    build:
      context: ..
      dockerfile: backend/services/agent/Dockerfile
    env_file:
      - ./services/agent/.env
    environment:
      AUTH_SERVICE: http://auth:8001
      CHAT_SERVICE: http://chat:8002
      PORT: 8003
      REDIS_URL: redis://redis:6379
    ports:
      - "8003:8003"
    depends_on:
      redis:
        condition: service_healthy

  billing:
    build:
      context: .
      dockerfile: services/billing/Dockerfile
    env_file:
      - ./services/billing/.env
    environment:
      AUTH_SERVICE: http://auth:8001
      PORT: 8004
      REDIS_URL: redis://redis:6379
    ports:
      - "8004:8004"
    depends_on:
      redis:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    env_file:
      - ./gateway/.env
    environment:
      PORT: 8000
      AUTH_SERVICE: http://auth:8001
      CHAT_SERVICE: http://chat:8002
      AGENT_SERVICE: http://agent:8003
      BILLING_SERVICE: http://billing:8004
      FRONTEND_URL: http://localhost:4000
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    depends_on:
      auth:
        condition: service_started
      chat:
        condition: service_started
      agent:
        condition: service_started
      billing:
        condition: service_started
